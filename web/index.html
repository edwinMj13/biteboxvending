<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BiteBox 24/7 - Smart, automated vending and retail network in Kerala.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BiteBox">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0A291D">

  <!-- Favicon (generated from assets/icons/app_icon.png) -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png" />

  <title>BiteBox 24/7 Vending</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0A291D; }

    /* ---- Loading screen (removed once Flutter paints its first frame) ---- */
    #bb-loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; padding: 16px; box-sizing: border-box;
      background: radial-gradient(circle at 50% 40%, #0F3A2A 0%, #0A291D 70%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #E6F4EE; text-align: center;
      transition: opacity .35s ease;
    }
    #bb-loader.bb-hide { opacity: 0; pointer-events: none; }
    .bb-brand { display: flex; align-items: center; gap: 10px; }
    .bb-badge {
      background: #10B981; color: #000; font-weight: 900; font-size: 22px;
      letter-spacing: 1.5px; padding: 8px 14px; border-radius: 10px;
    }
    .bb-247 { color: #10B981; font-weight: 700; font-size: 22px; }
    .bb-bar {
      width: 180px; height: 4px; border-radius: 4px; overflow: hidden;
      background: rgba(255, 255, 255, .1);
    }
    .bb-bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 4px;
      background: #10B981; animation: bb-slide 1.1s ease-in-out infinite;
    }
    @keyframes bb-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    .bb-msg { font-size: 14px; color: rgba(230, 244, 238, .7); min-height: 20px; margin: 0; }
    .bb-btn {
      font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      color: #000; background: #10B981; border: 0; border-radius: 999px;
      padding: 10px 22px;
    }
    .bb-btn:hover { background: #34D399; }
    .bb-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    #bb-loader .bb-btn { display: none; }
    #bb-loader.bb-slow .bb-btn, #bb-loader.bb-failed .bb-btn { display: inline-block; }
    #bb-loader.bb-failed .bb-bar { display: none; }

    /* ---- "New version available" prompt ---- */
    #bb-update {
      position: fixed; left: 50%; bottom: 24px; z-index: 10000;
      transform: translate(-50%, 140%); transition: transform .3s ease;
      display: flex; align-items: center; gap: 14px;
      max-width: calc(100% - 32px); box-sizing: border-box;
      padding: 10px 10px 10px 18px; border-radius: 999px;
      background: #0A291D; color: #E6F4EE; border: 1px solid rgba(16, 185, 129, .5);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px;
    }
    #bb-update.bb-show { transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      .bb-bar::after { animation-duration: 3s; }
      #bb-loader, #bb-update { transition: none; }
    }
  </style>
</head>

<body>
  <div id="bb-loader" role="status" aria-live="polite">
    <div class="bb-brand"><span class="bb-badge">BITEBOX</span><span class="bb-247">24/7</span></div>
    <div class="bb-bar" aria-hidden="true"></div>
    <p class="bb-msg" id="bb-msg">Loading…</p>
    <button class="bb-btn" type="button" onclick="bbReload()">Reload</button>
  </div>

  <div id="bb-update" role="alert" hidden>
    <span>A new version of BiteBox is available.</span>
    <button class="bb-btn" type="button" onclick="bbReload()">Reload</button>
  </div>

  <script>
    (function () {
      var loader = document.getElementById('bb-loader');
      var msg = document.getElementById('bb-msg');
      var started = false;

      // Hard reload that skips any cached copy of the entry files.
      window.bbReload = function () {
        var url = new URL(window.location.href);
        url.searchParams.set('_r', Date.now().toString(36));
        window.location.replace(url.toString());
      };

      // Drop the reload marker from the address bar once we've loaded.
      try {
        var here = new URL(window.location.href);
        if (here.searchParams.has('_r')) {
          here.searchParams.delete('_r');
          history.replaceState(history.state, '', here.toString());
        }
      } catch (e) { /* ignore */ }

      // Hide the loader when Flutter has painted its first frame.
      window.addEventListener('flutter-first-frame', function () {
        started = true;
        loader.classList.add('bb-hide');
        setTimeout(function () { loader.remove(); }, 400);
        startUpdateChecks();
      });

      // Slow network: offer a reload after 12s.
      setTimeout(function () {
        if (started) return;
        loader.classList.add('bb-slow');
        msg.textContent = 'This is taking longer than usual.';
      }, 12000);

      // Script failed to load (offline, bad deploy, blocked): show reload.
      window.addEventListener('error', function (e) {
        if (started) return;
        var t = e && e.target;
        if (t && t.tagName === 'SCRIPT') {
          loader.classList.add('bb-failed');
          msg.textContent = 'Something went wrong while loading. Please reload.';
        }
      }, true);

      // Older builds of this site registered a caching service worker that
      // can keep serving stale code. Remove it and its caches, then reload
      // once so the fresh files are used.
      if ('serviceWorker' in navigator) {
        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }).then(function () {
          if (!window.caches) return;
          return caches.keys().then(function (keys) {
            return Promise.all(keys.filter(function (k) {
              return k.indexOf('flutter') === 0;
            }).map(function (k) { return caches.delete(k); }));
          });
        }).then(function () {
          var key = 'bb-sw-cleaned';
          var done = false;
          try { done = sessionStorage.getItem(key) === '1'; } catch (e) { done = true; }
          if (hadController && !done) {
            try { sessionStorage.setItem(key, '1'); } catch (e) { /* ignore */ }
            window.bbReload();
          }
        }).catch(function () { /* ignore */ });
      }

      // ---- Detect a new deploy while the tab stays open ----
      // main.dart.js changes on every build, so its ETag / Last-Modified
      // tells us when a newer version is live.
      var currentStamp = null;
      var promptShown = false;

      function fetchStamp() {
        return fetch('main.dart.js', { method: 'HEAD', cache: 'no-store' })
          .then(function (r) {
            if (!r.ok) return null;
            return r.headers.get('etag') || r.headers.get('last-modified');
          })
          .catch(function () { return null; });
      }

      function checkForUpdate() {
        if (promptShown || document.visibilityState !== 'visible') return;
        fetchStamp().then(function (stamp) {
          if (!stamp) return;
          if (currentStamp === null) { currentStamp = stamp; return; }
          if (stamp !== currentStamp) showUpdatePrompt();
        });
      }

      function showUpdatePrompt() {
        promptShown = true;
        var bar = document.getElementById('bb-update');
        bar.hidden = false;
        requestAnimationFrame(function () { bar.classList.add('bb-show'); });
      }

      function startUpdateChecks() {
        checkForUpdate();
        setInterval(checkForUpdate, 5 * 60 * 1000);
        document.addEventListener('visibilitychange', checkForUpdate);
      }
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
