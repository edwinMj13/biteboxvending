    <!-- side panel: screen + keypad (QR) -->
    <rect x="356" y="132" width="88" height="120" rx="18" fill="#0A291D"/>
    <rect x="372" y="150" width="56" height="56" rx="6" fill="#FFFFFF"/>
    <g fill="#0A291D">
      <rect x="378" y="156" width="18" height="18" rx="3"/>
      <rect x="404" y="156" width="18" height="18" rx="3"/>
      <rect x="378" y="182" width="18" height="18" rx="3"/>
      <rect x="408" y="186" width="10" height="10" rx="2"/>
