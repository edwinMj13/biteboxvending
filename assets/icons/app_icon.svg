    <g fill="#10B981">
      <rect x="72" y="166" width="64" height="88" rx="14"/>
      <rect x="154" y="166" width="64" height="88" rx="14" fill="#FFFFFF"/>
      <rect x="236" y="166" width="64" height="88" rx="14" fill="#F97316"/>
      <rect x="72" y="292" width="64" height="88" rx="14" fill="#F97316"/>
      <rect x="154" y="292" width="64" height="88" rx="14"/>
      <rect x="236" y="292" width="64" height="88" rx="14" fill="#FFFFFF"/>
      <rect x="72" y="418" width="64" height="62" rx="14" fill="#FFFFFF"/>
      <rect x="154" y="418" width="64" height="62" rx="14" fill="#F97316"/>
      <rect x="236" y="418" width="64" height="62" rx="14"/>
    </g>
    <g fill="#14513A">
