<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0F3B2A"/><stop offset="1" stop-color="#0A291D"/></linearGradient></defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="488" r="380" fill="#10B981" opacity="0.14"/>
  <!-- vending machine -->
  <g transform="translate(272 168)">
    <rect x="0" y="0" width="480" height="640" rx="56" fill="#FFD369"/>
    <rect x="0" y="0" width="480" height="96" rx="56" fill="#F5B83D"/>
    <rect x="0" y="48" width="480" height="48" fill="#F5B83D"/>
